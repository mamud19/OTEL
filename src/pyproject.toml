[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-otel-collector"
version = "1.0.0"
description = "OpenTelemetry collector for GenAI/LLM traces with PII scrubbing, confidence scoring, and Azure Application Insights export"
authors = [{ name = "Mamud" }]
requires-python = ">=3.9"

dependencies = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-api>=1.20.0",
    "azure-monitor-opentelemetry-exporter>=1.0.0b21",
    "openai>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
